name: CI & Release Build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code validation
        run: |
          python -m compileall flashbang_shield

      - name: Run unit and integration tests
        run: |
          python -m unittest discover -s tests -t .

      - name: Run verification suite
        run: |
          python verify_flashbang_shield.py

  build-executable:
    needs: lint-and-test
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone executable (PyInstaller)
        run: |
          python build_exe.py

      - name: Build installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Calculate SHA-256 Checksums
        id: checksum
        shell: pwsh
        run: |
          $setupHash = (Get-FileHash dist/FlashbangShield-Setup.exe -Algorithm SHA256).Hash
          $exeHash = (Get-FileHash dist/FlashbangShield.exe -Algorithm SHA256).Hash
          echo "Setup SHA256: $setupHash"
          echo "Exe SHA256:   $exeHash"
          "$setupHash  FlashbangShield-Setup.exe`n$exeHash  FlashbangShield.exe" | Out-File -Encoding utf8 dist/checksums.sha256

      - name: Upload installer & executable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlashbangShield-Windows-x64
          path: |
            dist/FlashbangShield-Setup.exe
            dist/FlashbangShield.exe
            dist/checksums.sha256
          if-no-files-found: error

  publish-release:
    needs: build-executable
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: FlashbangShield-Windows-x64
          path: dist

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FlashbangShield-Setup.exe
            dist/FlashbangShield.exe
            dist/checksums.sha256
          generate_release_notes: true
